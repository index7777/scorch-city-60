name: QA Browser Smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: qa-browser-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Browser smoke syntax check
        run: |
          node --check qa/browser-smoke.mjs
          node --check qa/resident-fog-smoke.mjs
          node --check qa/resident-p0-smoke.mjs
          node --check qa/resident-survival-smoke.mjs
          node --check qa/resident-field-survival-smoke.mjs
          node --check qa/resident-itinerary-survival-smoke.mjs
          node --check qa/resident-water-allocation-smoke.mjs
          node --check qa/resident-water-cooling-smoke.mjs

      - name: Run rendered Chromium smoke tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/scorch-http.log 2>&1 &
          HTTP_PID=$!
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium binary found on runner"
            exit 1
          fi
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/scorch-chrome \
            http://127.0.0.1:4173/ >/tmp/scorch-chrome.log 2>&1 &
          CHROME_PID=$!
          cleanup(){ kill "$CHROME_PID" "$HTTP_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          ready=0
          for i in $(seq 1 80); do
            if curl -fs http://127.0.0.1:9222/json/version >/dev/null 2>&1 && curl -fs http://127.0.0.1:4173/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep .25
          done

          if [ "$ready" -ne 1 ]; then
            echo "Chromium CDP did not start within 20 seconds"
            cat /tmp/scorch-chrome.log || true
            exit 1
          fi

          timeout 90s node qa/browser-smoke.mjs
          timeout 90s node qa/resident-fog-smoke.mjs
          timeout 90s node qa/resident-p0-smoke.mjs
          timeout 90s node qa/resident-survival-smoke.mjs
          timeout 90s node qa/resident-field-survival-smoke.mjs
          timeout 90s node qa/resident-itinerary-survival-smoke.mjs
          timeout 90s node qa/resident-water-allocation-smoke.mjs
          timeout 90s node qa/resident-water-cooling-smoke.mjs
